name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      
      - name: Run tests
        run: |
          echo "Running tests..."
          # Add your test command here
          # npm test
          # pytest
          # go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      
      - name: Lint
        run: |
          echo "Running linter..."
          # Add your lint command here
          # npm run lint
          # flake8
          # golangci-lint run

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      
      - name: Security scan
        run: |
          echo "Running security scan..."
          # Add security scanning here
          # npm audit
          # snyk test
          # trivy fs .
