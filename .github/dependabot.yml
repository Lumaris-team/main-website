version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    target-branch: "main"
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
      include-scope: "@dependabot"
    groups:
      npm-patch-and-minor:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "wrangler"
        update-types: ["version-update:semver-major"]
