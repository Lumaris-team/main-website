  <meta property="og:site_name" content="Lumaris">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:image" content="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
  <meta name="twitter:card" content="summary_large_image">

    <script type="application/ld+json">
  {
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "Créer un compte — Lumaris",
  "url": "https://lumaris.fr.eu.org/sign-up",
  "description": "Créez votre compte Lumaris pour accéder à votre espace d'apprentissage intelligent.",
  "image": "https://shared-assets.lumaris.fr.eu.org/logo/logo.png",
  "isPartOf": {
    "@type": "WebSite",
    "@id": "https://lumaris.fr.eu.org/"
  },
  "inLanguage": "fr-FR"
}
  </script>
  <script type="application/ld+json">
  {
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Accueil",
      "item": "https://lumaris.fr.eu.org/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Créer un compte",
      "item": "https://lumaris.fr.eu.org/sign-up"
    }
  ]
}
  </script>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="site-header"><site-navbar site="main-website"></site-navbar></header>
  <main class="signup-shell">
    <section class="signup-card" aria-label="Créer un compte">
      <div class="signup-mark"><img src="https://shared-assets.lumaris.fr.eu.org/logo/logo.png" alt="Lumaris"></div>
      <p class="eyebrow"><span class="pulse"></span>Rejoindre Lumaris</p>
      <h1>Votre espace,<br><em>à vous.</em></h1>
      <p class="signup-sub">Créez votre identifiant pour retrouver vos outils scolaires au même endroit.</p>
      <form id="signup-form" autocomplete="on">
        <label class="field">
          <span>Pseudo</span>
          <input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="64" placeholder="p. ex. daniel">
        </label>
        <label class="field">
          <span>Adresse e-mail</span>
          <input type="email" name="email" autocomplete="email" required placeholder="vous@exemple.com">
        </label>
        <p id="signup-message" class="form-message" role="status" hidden></p>
        <button type="submit" class="submit">Créer mon compte <span class="submit-icon">↗</span></button>
      </form>
      <p class="signup-alt">Vous avez déjà un compte ? <a href="/sign-in">Se connecter</a></p>
    </section>
  </main>
  <script type="module" src="https://shared-assets.lumaris.fr.eu.org/navbar.js?v=20261122-all-nav"></script>
  <script type="module" src="/pages/sign-up/script.js"></script>
</body>
</html>
