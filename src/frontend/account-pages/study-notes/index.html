<!doctype html>
<html lang="fr" data-auth-pending>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080912">
    <title>Study Notes - Lumaris-Team Dashboard</title>
    <meta name="description" content="Study Notes - Manage your revision cards and study materials.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    
    
    <!-- Megajs for browser -->
    <script src="https://unpkg.com/megajs@1.3.10/dist/main.browser-umd.js"></script>

    
    <style>html[data-auth-pending] body { visibility: hidden; }</style>
    <script type="module">
      import { guardPage } from "/lib/auth.js";
      import { hideLoadingOverlay } from "/lib/loading.js";
      document.documentElement.removeAttribute("data-auth-pending");
 guardPage().then((ok) => {
        if (!ok) {
          window.location.href = '/pages/auth';
        }
      });
    </script>
    <script type="module" src="/lib/settings.js"></script>
    <link rel="stylesheet" href="/styles/sidebar.css">
    <link rel="stylesheet" href="/styles/block.css">
    <link rel="stylesheet" href="/pages/study-notes/style.css">
    <script type="module" src="https://shared-assets.lumaris.fr.eu.org/navbar.js?v=20261115-user-cta"></script>
    <script type="module" src="/pages/study-notes/icons.js"></script>
    <script type="module" src="/pages/study-notes/script.js"></script>
  </head>
  <body>
    <site-navbar site="client-worker" current="study-notes"></site-navbar>

    <div class="study-notes-shell">
      <aside class="study-notes-sidebar" aria-label="Study notes actions">
        <button class="study-notes-nav" type="button" id="homeworks-tab-btn" aria-label="Homeworks tab" data-active="true">
          <span class="study-notes-icon" data-icon="https://shared-assets.lumaris.fr.eu.org/icons/homework.svg"></span>
        </button>
        <button class="study-notes-nav" type="button" id="note-taking-tab-btn" aria-label="Note taking tab">
          <span class="study-notes-icon" data-icon="https://shared-assets.lumaris.fr.eu.org/icons/note-taking.svg"></span>
        </button>
        <button class="study-notes-nav" type="button" id="ai-tab-btn" aria-label="AI tab">
          <span class="study-notes-icon" data-icon="https://shared-assets.lumaris.fr.eu.org/icons/sparkles.svg"></span>
        </button>
        <button class="study-notes-nav" type="button" id="upload-btn" aria-label="Upload file">
          <span class="study-notes-icon" data-icon="https://shared-assets.lumaris.fr.eu.org/icons/plus.svg"></span>
        </button>
        <button class="study-notes-nav" type="button" id="folder-btn" aria-label="Create folder">
          <span class="study-notes-icon" data-icon="https://shared-assets.lumaris.fr.eu.org/icons/subjects.svg"></span>
        </button>
      </aside>

      <main class="study-notes-main">
        <!-- Homeworks Tab Content -->
        <div class="study-notes-tab" id="homeworks-tab" data-active="true">
          <div class="homeworks-header">
            <h1 class="homeworks-title">My Subjects</h1>
          </div>

          <div class="bento-block homeworks-container">
            <div class="subjects-list" id="subjects-list">
              <div class="empty-state loading">
                <p class="empty-state-text">Loading...</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Note Taking Tab Content -->
        <div class="study-notes-tab" id="note-taking-tab" data-active="false">
          <div class="note-taking-header">
            <h1 class="note-taking-title">Note Taking</h1>
            <div class="note-taking-actions">
              <button class="note-action-btn" type="button" id="import-note-btn" aria-label="Import note" style="cursor: pointer;">
                <span data-icon="https://shared-assets.lumaris.fr.eu.org/icons/upload.svg"></span>
                <span>Import</span>
              </button>
              <button class="note-action-btn" type="button" id="download-note-btn" aria-label="Download note" style="cursor: pointer;">
                <span data-icon="https://shared-assets.lumaris.fr.eu.org/icons/download.svg"></span>
                <span>Download</span>
              </button>
              <button class="note-action-btn primary" type="button" id="save-note-btn" aria-label="Save to cloud" style="cursor: pointer;">
                <span data-icon="https://shared-assets.lumaris.fr.eu.org/icons/cloud-save.svg"></span>
                <span>Save to Cloud</span>
              </button>
            </div>
          </div>
          <div class="bento-block note-taking-container">
            <textarea class="note-editor" id="note-editor" placeholder="Start typing your notes here..."></textarea>
          </div>
        </div>

        <!-- AI Tab Content -->
        <div class="study-notes-tab" id="ai-tab" data-active="false">
          <div class="bento-block ai-container">
            <div class="ai-content">
              <div class="ai-icon-wrapper">
                <span class="ai-icon" data-icon="https://shared-assets.lumaris.fr.eu.org/icons/sparkles.svg"></span>
              </div>
              <h1 class="ai-title">Study Notes Generation</h1>
              <p class="ai-message">Revision cards generation coming soon</p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Add Subject Modal -->
    <div class="modal" id="add-subject-modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2 class="modal-title">Create Subject</h2>
        <form id="add-subject-form">
          <div class="form-group">
            <label for="subject-name">Enter subject name</label>
            <input type="text" id="subject-name" name="name" required placeholder="e.g., Mathematics, Physics">
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancel-add-subject-btn">Cancel</button>
            <button type="submit" class="btn-primary">Create</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Add File Modal -->
    <div class="modal" id="add-file-modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2 class="modal-title">Upload File</h2>
        <form id="add-file-form">
          <div class="form-group">
            <label for="subject-select">Select Subject</label>
            <select id="subject-select" name="subject" required>
              <option value="">Loading subjects...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="file-input">Choose File</label>
            <input type="file" id="file-input" name="file" required>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancel-add-file-btn">Cancel</button>
            <button type="submit" class="btn-primary">Upload</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Save Note Modal -->
    <div class="modal" id="save-note-modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2 class="modal-title">Save Note to Cloud</h2>
        <form id="save-note-form">
          <div class="form-group">
            <label for="note-subject-select">Select Subject</label>
            <select id="note-subject-select" name="subject" required>
              <option value="">Loading subjects...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="note-filename">File Name</label>
            <input type="text" id="note-filename" name="filename" required placeholder="e.g., my-notes">
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancel-save-note-btn">Cancel</button>
            <button type="submit" class="btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Rename Modal -->
    <div class="modal" id="rename-modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2 class="modal-title">Rename</h2>
        <form id="rename-form">
          <div class="form-group">
            <label for="rename-name">New Name</label>
            <input type="text" id="rename-name" name="name" required>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancel-rename-btn">Cancel</button>
            <button type="submit" class="btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="delete-modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2 class="modal-title">Delete Item</h2>
        <p class="modal-message">Are you sure you want to delete this item?</p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancel-delete-btn">No</button>
          <button type="button" class="btn-danger" id="confirm-delete-btn">Yes</button>
        </div>
      </div>
    </div>
  </body>
</html>
