<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080912">
    <title>Accès refusé - Dashboard Lumaris</title>
    <meta name="description" content="Votre session n'a pas pu être vérifiée.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="apple-touch-icon" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/pages/error-token/style.css">
    <script type="module" src="/lib/settings.js"></script>
    <script type="module" src="/lib/icons.js"></script>
    <script type="module">
      import { loadIcons } from '/lib/icons.js';
      loadIcons();
    </script>
  </head>
  <body>
    <main class="error-shell">
      <section class="error-card" role="alert">
        <span class="error-badge" aria-hidden="true">
          <span data-icon="https://shared-assets.lumaris.fr.eu.org/icons/warning.svg"></span>
        </span>
        <p class="error-eyebrow">Accès refusé</p>
        <h1>Nous n'avons pas pu vérifier votre session</h1>
        <p class="error-text">
          Votre jeton d'authentification est manquant, expiré ou invalide.
          Par mesure de sécurité, cette page ne peut pas s'afficher.
          Veuillez vous reconnecter pour continuer.
        </p>
        <div class="error-actions">
          <a class="error-btn error-btn-primary" href="/pages/auth">Se reconnecter</a>
        </div>
        <p class="error-hint">Code erreur : <span>INVALID_SESSION_TOKEN</span></p>
      </section>
    </main>
  </body>
</html>
