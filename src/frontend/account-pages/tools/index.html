<!doctype html>
<html lang="fr" data-auth-pending>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080912">
    <title>Outils - Dashboard Lumaris</title>
    <meta name="description" content="Outils utiles : calculatrice scientifique, convertisseur d'unités, exécuteur de code et plus.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="apple-touch-icon" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="manifest" href="/site.webmanifest">
    
    
    
    <style>html[data-auth-pending] body { visibility: hidden; }</style>
    <script type="module" src="/account-pages/init-auth.js"></script>
    <script type="module" src="/lib/settings.js"></script>
    <link rel="stylesheet" href="/styles/sidebar.css">
    <link rel="stylesheet" href="/styles/block.css">
    <link rel="stylesheet" href="/pages/tools/style.css">
    <script type="module" src="https://shared-assets.lumaris.fr.eu.org/navbar.js?v=20261201-squircle"></script>
    <script type="module" src="/pages/tools/icons.js"></script>
    <script type="module" src="/pages/tools/script.js"></script>
  </head>
  <body>
    <site-navbar site="client-worker" current="tools"></site-navbar>

    <div class="tools-shell">
      <aside class="tools-sidebar" aria-label="Sections outils">
        <button class="tools-nav" type="button" id="calculator-btn" data-section="calculator" aria-label="Calculatrice">
          <span class="tools-icon" data-icon="https://shared-assets.lumaris.fr.eu.org/icons/calculator.svg"></span>
        </button>
        <button class="tools-nav" type="button" id="converter-btn" data-section="converter" aria-label="Convertisseur">
          <span class="tools-icon" data-icon="https://shared-assets.lumaris.fr.eu.org/icons/converter.svg"></span>
        </button>
        <button class="tools-nav" type="button" id="code-executor-btn" data-section="code-executor" aria-label="Exécuteur de code">
          <span class="tools-icon" data-icon="https://shared-assets.lumaris.fr.eu.org/icons/code.svg"></span>
        </button>
      </aside>

      <main class="tools-main">
        <!-- Calculator Section -->
        <section class="tools-section" id="calculator-section" data-active="true">
          <div class="bento-block calculator-container">
            <p class="block-eyebrow">Calculatrice</p>
            <h2 class="section-title">Calculatrice scientifique</h2>
            <div class="calculator-display">
              <div class="calculator-expression" id="calc-expression"></div>
              <div class="calculator-result" id="calc-result">0</div>
            </div>
            <div class="calculator-buttons">
              <div class="calc-row">
                <button class="calc-btn calc-btn-function" data-action="second" id="second-btn">2nd</button>
                <button class="calc-btn calc-btn-function" data-action="clear">C</button>
                <button class="calc-btn calc-btn-function" data-action="backspace">⌫</button>
                <button class="calc-btn calc-btn-operator" data-action="operator" data-value="/">÷</button>
              </div>
              <div class="calc-row">
                <button class="calc-btn calc-btn-function" data-action="sin" data-alt="asin">sin</button>
                <button class="calc-btn calc-btn-function" data-action="cos" data-alt="acos">cos</button>
                <button class="calc-btn calc-btn-function" data-action="tan" data-alt="atan">tan</button>
                <button class="calc-btn calc-btn-operator" data-action="operator" data-value="*">×</button>
              </div>
              <div class="calc-row">
                <button class="calc-btn calc-btn-function" data-action="log" data-alt="10x">log</button>
                <button class="calc-btn calc-btn-function" data-action="ln" data-alt="ex">ln</button>
                <button class="calc-btn calc-btn-function" data-action="sqrt" data-alt="cbrt">√</button>
                <button class="calc-btn calc-btn-operator" data-action="operator" data-value="-">−</button>
              </div>
              <div class="calc-row">
                <button class="calc-btn calc-btn-function" data-action="power" data-alt="root">x^y</button>
                <button class="calc-btn calc-btn-function" data-action="pi">π</button>
                <button class="calc-btn calc-btn-function" data-action="e">e</button>
                <button class="calc-btn calc-btn-operator" data-action="operator" data-value="+">+</button>
              </div>
              <div class="calc-row">
                <button class="calc-btn calc-btn-function" data-action="parenthesis" data-value="(">(</button>
                <button class="calc-btn calc-btn-function" data-action="parenthesis" data-value=")">)</button>
                <button class="calc-btn calc-btn-function" data-action="factorial">n!</button>
                <button class="calc-btn calc-btn-operator" data-action="equals">=</button>
              </div>
              <div class="calc-row calc-row-numbers">
                <button class="calc-btn calc-btn-number" data-value="7">7</button>
                <button class="calc-btn calc-btn-number" data-value="8">8</button>
                <button class="calc-btn calc-btn-number" data-value="9">9</button>
                <button class="calc-btn calc-btn-number" data-value="4">4</button>
                <button class="calc-btn calc-btn-number" data-value="5">5</button>
                <button class="calc-btn calc-btn-number" data-value="6">6</button>
                <button class="calc-btn calc-btn-number" data-value="1">1</button>
                <button class="calc-btn calc-btn-number" data-value="2">2</button>
                <button class="calc-btn calc-btn-number" data-value="3">3</button>
                <button class="calc-btn calc-btn-number" data-value="0">0</button>
                <button class="calc-btn calc-btn-number" data-value=".">.</button>
                <button class="calc-btn calc-btn-number" data-action="sign">±</button>
              </div>
            </div>
          </div>
          <div class="bento-block calculator-history-container">
            <div class="calculator-history-header">
              <h3>Historique des calculs</h3>
              <button id="clear-history-btn" class="clear-history-btn">Effacer</button>
            </div>
            <div id="calculator-history" class="calculator-history">
              <p class="history-empty">Aucun calcul pour le moment</p>
            </div>
          </div>
        </section>

        <!-- Converter Section -->
        <section class="tools-section" id="converter-section" data-active="false">
          <div class="bento-block converter-container">
            <p class="block-eyebrow">Convertisseur</p>
            <h2 class="section-title">Convertisseur d'unités</h2>
            
            <div class="converter-type-selector">
              <button class="converter-type-btn" data-type="length" data-active="true">Longueur</button>
              <button class="converter-type-btn" data-type="volume">Volume</button>
              <button class="converter-type-btn" data-type="capacity">Capacité</button>
              <button class="converter-type-btn" data-type="currency">Devise</button>
            </div>

            <div class="converter-inputs">
              <div class="converter-input-group">
                <label for="converter-from">De</label>
                <input type="number" id="converter-from" placeholder="Saisir une valeur" step="any">
                <select id="converter-from-unit">
                  <!-- Units will be populated by JS -->
                </select>
              </div>
              
              <div class="converter-swap">
                <button id="converter-swap-btn" aria-label="Inverser les unités">
                  <span data-icon="https://shared-assets.lumaris.fr.eu.org/icons/swap.svg"></span>
                </button>
              </div>

              <div class="converter-input-group">
                <label for="converter-to">Vers</label>
                <input type="number" id="converter-to" placeholder="Résultat" readonly>
                <select id="converter-to-unit">
                  <!-- Units will be populated by JS -->
                </select>
              </div>
            </div>

            <div class="converter-result" id="converter-result-display"></div>
          </div>
        </section>

        <!-- Code Executor Section -->
        <section class="tools-section" id="code-executor-section" data-active="false">
          <div class="bento-block code-executor-container">
            <p class="block-eyebrow">Exécuteur de code</p>
            <h2 class="section-title">Exécuter du code</h2>
            
            <div class="code-language-selector">
              <button class="code-lang-btn" data-lang="javascript" data-active="true">JavaScript</button>
            </div>

            <div class="code-editor-container">
              <textarea id="code-input" placeholder="Entrez votre code ici..." spellcheck="false"></textarea>
            </div>

            <div class="code-actions">
              <button id="code-run-btn" type="button">
                <span data-icon="https://shared-assets.lumaris.fr.eu.org/icons/play.svg"></span>
                Exécuter
              </button>
              <button id="code-clear-btn" type="button">Effacer</button>
            </div>

            <div class="code-output">
              <div class="code-output-header">
                <span>Sortie</span>
                <button id="code-copy-output" type="button" aria-label="Copier la sortie">
                  <span data-icon="https://shared-assets.lumaris.fr.eu.org/icons/copy.svg"></span>
                </button>
              </div>
              <pre id="code-output-content"></pre>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
