<!doctype html>
<html lang="fr" data-auth-pending>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080912">
    <title>Fichiers - Dashboard Lumaris</title>
    <meta name="description" content="Gérez vos fichiers : importez, organisez et accédez à vos fichiers avec une interface moderne.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="apple-touch-icon" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="manifest" href="/site.webmanifest">
    
    
    
    <style>html[data-auth-pending] body { visibility: hidden; }</style>
    <script type="module" src="/account-pages/init-auth.js"></script>
    <script type="module" src="/lib/settings.js"></script>
    <link rel="stylesheet" href="/styles/sidebar.css">
    <link rel="stylesheet" href="/styles/block.css">
    <link rel="stylesheet" href="/pages/files/style.css">
    <script type="module" src="https://shared-assets.lumaris.fr.eu.org/navbar.js?v=20261201-squircle"></script>
    <script type="module" src="/pages/files/icons.js"></script>
    <script type="module" src="/pages/files/script.js"></script>
  </head>
  <body>
    <site-navbar site="client-worker" current="files"></site-navbar>

    <div class="files-shell">
      <aside class="files-sidebar" aria-label="Actions fichiers">
        <button class="files-nav" type="button" id="upload-btn" aria-label="Importer un fichier">
          <span class="files-icon" data-icon="https://shared-assets.lumaris.fr.eu.org/icons/plus.svg"></span>
        </button>
        <button class="files-nav" type="button" id="download-btn" aria-label="Télécharger le fichier" style="display: none;">
          <span class="files-icon" data-icon="https://shared-assets.lumaris.fr.eu.org/icons/download.svg"></span>
        </button>
        <button class="files-nav" type="button" id="folder-btn" aria-label="Créer un dossier">
          <span class="files-icon" data-icon="https://shared-assets.lumaris.fr.eu.org/icons/folder.svg"></span>
        </button>
      </aside>

      <main class="files-main">
        <div class="files-header">
          <h1 class="files-title">Mes fichiers</h1>
          <div class="files-path" id="files-path">
            <!-- Breadcrumb navigation will be populated by JS -->
          </div>
        </div>
        
        <div class="bento-block files-container">
          <div class="files-list" id="files-list">
            <!-- Files and folders will be populated by JS -->
          </div>
        </div>
      </main>
    </div>

    <!-- Upload Modal -->
    <div class="modal" id="upload-modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2 class="modal-title">Importer un fichier</h2>
        <form id="upload-form">
          <div class="form-group">
            <label for="file-input">Choisir un fichier</label>
            <input type="file" id="file-input" name="file" required>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancel-upload-btn">Annuler</button>
            <button type="submit" class="btn-primary">Importer</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="delete-modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2 class="modal-title">Supprimer un élément</h2>
        <p class="modal-message">Êtes-vous sûr de vouloir supprimer cet élément ?</p>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancel-delete-btn">Non</button>
          <button type="button" class="btn-danger" id="confirm-delete-btn">Oui</button>
        </div>
      </div>
    </div>

    <!-- Edit/Rename Modal -->
    <div class="modal" id="edit-modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2 class="modal-title">Renommer un élément</h2>
        <form id="edit-form">
          <div class="form-group">
            <label for="edit-name">Nouveau nom</label>
            <input type="text" id="edit-name" name="name" required>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancel-edit-btn">Annuler</button>
            <button type="submit" class="btn-primary">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Create Folder Modal -->
    <div class="modal" id="folder-modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2 class="modal-title">Créer un dossier</h2>
        <form id="folder-form">
          <div class="form-group">
            <label for="folder-name">Nom du dossier</label>
            <input type="text" id="folder-name" name="name" required>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancel-folder-btn">Annuler</button>
            <button type="submit" class="btn-primary">Créer</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
