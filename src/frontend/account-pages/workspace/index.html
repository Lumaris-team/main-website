<!doctype html>
<html lang="fr" data-auth-pending>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080912">
    <title>Workspace - Dashboard Lumaris</title>
    <meta name="description" content="Workspace : matières, chapitres, tâches, tâches récurrentes et événements.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="apple-touch-icon" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="manifest" href="/site.webmanifest">

    <style>html[data-auth-pending] body { visibility: hidden; }</style>
    <script type="module" src="/account-pages/init-auth.js"></script>
    <script type="module" src="/lib/settings.js"></script>
    <link rel="stylesheet" href="/pages/workspace/style.css">
    <script type="module" src="https://shared-assets.lumaris.fr.eu.org/navbar.js?v=20261201-squircle"></script>
    <script type="module" src="/pages/workspace/icons.js"></script>
  </head>
  <body>
    <site-navbar site="client-worker" current="workspace"></site-navbar>

    <div class="ws-app">
      <!-- ===== Header ===== -->
      <header class="ws-header">
        <div class="ws-header-left">
          <p class="ws-eyebrow" id="todayLabel">Workspace</p>
          <h1 class="ws-title" id="pageTitle">Tâches</h1>
        </div>
        <div class="ws-stats" id="statsBar"></div>
      </header>

      <!-- ===== Breadcrumb ===== -->
      <nav class="ws-breadcrumb" id="breadcrumb" hidden></nav>

      <!-- ===== Toolbar ===== -->
      <div class="ws-toolbar ws-toolbar-nav">
        <div class="ws-nav-group">
          <div class="ws-segmented ws-section-tabs" role="tablist" id="sectionTabs">
            <button class="ws-seg" type="button" data-section="tasks" data-active="true">Tâches</button>
            <button class="ws-seg" type="button" data-section="subjects">Matières</button>
            <button class="ws-seg" type="button" data-section="timetable">Emploi du temps</button>
          </div>
          <div class="ws-segmented ws-subtabs" role="tablist" id="taskTabs" hidden>
            <button class="ws-seg" type="button" data-view="all" data-active="true">Toutes</button>
            <button class="ws-seg" type="button" data-view="recurring">Récurrentes</button>
            <button class="ws-seg" type="button" data-view="events">Événements</button>
            <button class="ws-seg" type="button" data-view="trash">Corbeille</button>
          </div>
        </div>
        <div class="ws-nav-group ws-nav-right">
          <div class="ws-tpl" id="templateMenu">
            <button class="ws-template-btn" type="button" id="templateSelect">Modèles</button>
            <div class="ws-tpl-pop" id="templatePop" hidden>
              <div class="ws-tpl-list" id="templateList"></div>
              <button class="ws-tpl-add" type="button" id="templateAdd">＋ Ajouter un modèle</button>
            </div>
            <button class="ws-icon-btn ws-tpl-mini" type="button" id="templateEdit" title="Renommer le modèle" hidden>✎</button>
            <button class="ws-icon-btn ws-tpl-mini" type="button" id="templateDel" title="Supprimer le modèle" hidden>🗑</button>
          </div>
          <div class="ws-search">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="text" id="searchInput" placeholder="Rechercher…" autocomplete="off" spellcheck="false">
          </div>
          <button class="ws-btn ws-btn-primary" type="button" id="newBtn" title="Ouvrir le formulaire de création">＋ Nouveau</button>
        </div>
      </div>

      <!-- ===== Body ===== -->
      <div class="ws-body">
        <section class="ws-list-pane" id="listPane">
          <div class="ws-groups" id="taskGroups"></div>
          <div class="ws-subjects" id="subjectGrid" hidden></div>
          <div class="ws-timetable" id="timetableView" hidden></div>
          <div class="ws-empty" id="emptyState" hidden>
            <div class="ws-empty-icon">✦</div>
            <p class="ws-empty-title" id="emptyTitle">Rien ici</p>
            <p class="ws-empty-sub" id="emptySub">Créez votre premier élément.</p>
          </div>
        </section>

        <!-- ===== Detail panel ===== -->
        <aside class="ws-detail" id="detailPanel" hidden>
          <div class="ws-detail-head">
            <div class="ws-detail-title-wrap">
              <input class="ws-detail-title" id="dTitle" type="text" placeholder="Sans titre" spellcheck="false">
              <span class="ws-detail-badges" id="dBadges"></span>
            </div>
            <div class="ws-detail-actions">
              <button class="ws-icon-btn" type="button" id="dExpand" title="Ouvrir l'éditeur plein écran">⛶</button>
              <button class="ws-icon-btn" type="button" id="dToggleDone" title="Marquer comme fait">✓</button>
              <button class="ws-icon-btn" type="button" id="dEdit" title="Modifier tous les champs">✎</button>
              <button class="ws-icon-btn" type="button" id="dClose" title="Fermer">✕</button>
            </div>
          </div>

          <div class="ws-detail-scroll" id="dFields"></div>

          <div class="ws-detail-foot">
            <button class="ws-btn ws-btn-ghost" type="button" id="dDelete">Supprimer</button>
            <button class="ws-btn ws-btn-primary" type="button" id="dSave">Enregistrer</button>
          </div>
        </aside>
      </div>
    </div>

    <!-- ===== Creation / edit modal ===== -->
    <div class="ws-modal-root" id="modalRoot" hidden></div>

    <div class="ws-toast" id="toast" hidden></div>

    <script type="module" src="/pages/workspace/script.js"></script>
  </body>
</html>
