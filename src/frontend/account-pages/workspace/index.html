<!doctype html>
<html lang="en" data-auth-pending>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080912">
    <title>Workspace - Lumaris-Team Dashboard</title>
    <meta name="description" content="Workspace - Manage your tasks, recurring tasks and events.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="apple-touch-icon" href="https://shared-assets.lumaris.fr.eu.org/logo/logo.png">
    <link rel="manifest" href="/site.webmanifest">

    <style>html[data-auth-pending] body { visibility: hidden; }</style>
    <script type="module" src="/account-pages/init-auth.js"></script>
    <script type="module" src="/lib/settings.js"></script>
    <link rel="stylesheet" href="/pages/workspace/style.css">
    <script type="module" src="https://shared-assets.lumaris.fr.eu.org/navbar.js?v=20261122-all-nav"></script>
    <script type="module" src="/pages/workspace/icons.js"></script>
  </head>
  <body>
    <site-navbar site="client-worker" current="workspace"></site-navbar>

    <div class="ws-app">
      <!-- ===== Header ===== -->
      <header class="ws-header">
        <div class="ws-header-left">
          <p class="ws-eyebrow" id="todayLabel">Workspace</p>
          <h1 class="ws-title">Tasks</h1>
        </div>
        <div class="ws-stats" id="statsBar"></div>
      </header>

      <!-- ===== Toolbar ===== -->
      <div class="ws-toolbar">
        <div class="ws-quickadd">
          <input type="text" id="quickAddInput" placeholder="Add a task…  (Enter)" autocomplete="off" spellcheck="false">
          <button class="ws-btn ws-btn-primary" type="button" id="quickAddBtn">Add</button>
        </div>
        <div class="ws-filters">
          <div class="ws-segmented" role="tablist" id="viewTabs">
            <button class="ws-seg" type="button" data-view="tasks" data-active="true">Tasks</button>
            <button class="ws-seg" type="button" data-view="repeat">Recurring</button>
            <button class="ws-seg" type="button" data-view="events">Events</button>
            <button class="ws-seg" type="button" data-view="trash">Trash</button>
          </div>
          <div class="ws-search">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="text" id="searchInput" placeholder="Search…" autocomplete="off" spellcheck="false">
          </div>
        </div>
      </div>

      <!-- ===== Body ===== -->
      <div class="ws-body">
        <section class="ws-list-pane" id="listPane">
          <div class="ws-groups" id="taskGroups"></div>
          <div class="ws-empty" id="emptyState" hidden>
            <div class="ws-empty-icon">✦</div>
            <p class="ws-empty-title" id="emptyTitle">Nothing here</p>
            <p class="ws-empty-sub" id="emptySub">Create your first task above.</p>
          </div>
        </section>

        <!-- ===== Detail drawer ===== -->
        <aside class="ws-detail" id="detailPanel" hidden>
          <div class="ws-detail-head">
            <div class="ws-detail-title-wrap">
              <input class="ws-detail-title" id="dTitle" type="text" placeholder="Untitled" spellcheck="false">
              <span class="ws-detail-badges" id="dBadges"></span>
            </div>
            <div class="ws-detail-actions">
              <button class="ws-icon-btn" type="button" id="dToggleDone" title="Toggle done">✓</button>
              <button class="ws-icon-btn" type="button" id="dClose" title="Close">✕</button>
            </div>
          </div>

          <div class="ws-detail-scroll" id="dFields"></div>

          <div class="ws-detail-foot">
            <button class="ws-btn ws-btn-ghost" type="button" id="dDelete">Move to trash</button>
            <button class="ws-btn ws-btn-primary" type="button" id="dSave">Save changes</button>
          </div>
        </aside>
      </div>
    </div>

    <div class="ws-toast" id="toast" hidden></div>

    <script type="module" src="/pages/workspace/script.js"></script>
  </body>
</html>
